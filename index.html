<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MidnightDrive | Vortex Radar HUD</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-red: #ff0033;
            --bg-dark: #000000;
        }

        body, html {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0; padding: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        /* 🌌 渦流黑洞背景：參考圖片的流動感 */
        .vortex-container {
            position: absolute;
            width: 250vmax; height: 250vmax;
            display: flex; justify-content: center; align-items: center;
            z-index: -1;
            background: repeating-conic-gradient(
                from 0deg,
                var(--bg-dark) 0deg,
                var(--bg-dark) 2deg,
                rgba(0, 242, 255, 0.15) 3deg,
                var(--bg-dark) 4deg
            );
            animation: vortexRotate 10s linear infinite;
            filter: blur(2px);
            transition: background 0.5s ease;
        }

        .vortex-overlay {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, var(--bg-dark) 80%);
            z-index: -1;
        }

        /* ⚠️ 警告狀態（超速或靠近相機）：切換紅光渦流 */
        .warning-mode .vortex-container {
            background: repeating-conic-gradient(
                from 0deg,
                var(--bg-dark) 0deg,
                var(--bg-dark) 2deg,
                rgba(255, 0, 51, 0.4) 3deg,
                var(--bg-dark) 4deg
            );
            animation: vortexRotate 1.5s linear infinite; /* 警告時極速旋轉 */
        }

        @keyframes vortexRotate {
            from { transform: rotate(0deg) scale(1); }
            to { transform: rotate(360deg) scale(1.1); }
        }

        /* 🔢 螢光數字顯示 */
        .speed-display { position: relative; text-align: center; z-index: 10; }

        .speed-num {
            font-size: calc(100vw * 0.45); font-weight: 900; margin: 0; line-height: 1;
            font-variant-numeric: tabular-nums; color: #fff;
            text-shadow: 0 0 15px #fff, 0 0 30px var(--neon-blue), 0 0 60px var(--neon-blue), 0 0 100px var(--neon-blue);
            transition: all 0.4s ease;
        }

        .warning-mode .speed-num {
            text-shadow: 0 0 15px #fff, 0 0 30px var(--neon-red), 0 0 60px var(--neon-red), 0 0 120px var(--neon-red);
            animation: pulsate 0.4s infinite alternate;
        }

        @keyframes pulsate { from { transform: scale(1); } to { transform: scale(1.05); } }

        /* 📡 測速資訊文字 */
        .radar-hint {
            position: absolute; top: 12%; font-size: 24px; font-weight: bold;
            color: #ffcc00; text-shadow: 0 0 15px var(--neon-red);
            display: none; letter-spacing: 2px;
        }
        .warning-mode .radar-hint.active { display: block; }

        .unit { font-size: 24px; color: rgba(255,255,255,0.3); letter-spacing: 12px; margin-top: -15px; text-transform: uppercase; }

        .controls { position: absolute; bottom: 8%; text-align: center; width: 100%; z-index: 20; }
        button { 
            padding: 18px 50px; background: rgba(0,0,0,0.8); color: var(--neon-blue);
            border: 2px solid var(--neon-blue); border-radius: 60px; font-weight: bold; font-size: 18px; 
        }
    </style>
</head>
<body id="main-body">

    <div class="vortex-container" id="vortex"></div>
    <div class="vortex-overlay"></div>
    
    <div id="radar-hint" class="radar-hint">⚠️ RADAR AHEAD: <span id="dist-val">---</span>m</div>

    <div class="speed-display">
        <h1 class="speed-num" id="speed">0</h1>
        <div class="unit">km/h</div>
    </div>

    <div class="controls">
        <button id="start-btn" onclick="startSystem()">INITIALIZE HUD</button>
    </div>

<script>
    const SPEED_LIMIT = 110;
    // 國道主要測速座標 (南投/台中/國6熱點)
    const cameraPoints = [
        { name: "國6 西 27.5K", lat: 23.9612, lng: 120.9085 },
        { name: "國6 東 28.2K", lat: 23.9635, lng: 120.9150 },
        { name: "國3 南 226.2K", lat: 23.9450, lng: 120.6780 },
        { name: "國3 北 233.5K", lat: 23.8780, lng: 120.6920 },
        { name: "國1 南 180.2K", lat: 24.1785, lng: 120.6305 },
        { name: "國1 北 187.6K", lat: 24.1150, lng: 120.5920 }
    ];

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const dLat = (lat2-lat1) * Math.PI/180;
        const dLon = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function startSystem() {
        document.getElementById('start-btn').style.display = 'none';
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition((pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                const kmh = Math.round((pos.coords.speed || 0) * 3.6);
                
                document.getElementById('speed').innerText = kmh;

                // 測速點距離檢測
                let minDist = Infinity;
                cameraPoints.forEach(p => {
                    const d = getDistance(lat, lng, p.lat, p.lng);
                    if (d < minDist) minDist = d;
                });

                const body = document.getElementById('main-body');
                const hint = document.getElementById('radar-hint');
                const distVal = document.getElementById('dist-val');
                const vortex = document.getElementById('vortex');

                // 觸發警告條件：超速 OR 靠近測速照相 600m 內
                const isNearCamera = minDist < 600;
                const isOverSpeed = kmh > SPEED_LIMIT;

                if (isNearCamera || isOverSpeed) {
                    body.classList.add('warning-mode');
                    if (isNearCamera) {
                        hint.classList.add('active');
                        distVal.innerText = Math.round(minDist);
                    }
                } else {
                    body.classList.remove('warning-mode');
                    hint.classList.remove('active');
                }

                // 開越快背景流動越狂暴
                let flowSpeed = Math.max(0.8, 10 - (kmh / 15));
                vortex.style.animationDuration = flowSpeed + 's';

            }, (err) => { alert("GPS Signal Lost"); }, { enableHighAccuracy: true });
        }
    }
</script>
</body>
</html>
