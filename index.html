<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MidnightDrive | Black Hole HUD</title>
    <style>
        :root {
            --glow-color: #007aff;
            --bg-color: #050505;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 黑洞外圈容器 */
        .blackhole-container {
            position: relative;
            width: 350px;
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 旋轉的黑洞光暈 */
        .blackhole-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, var(--glow-color), transparent 60%);
            animation: rotate 2s linear infinite;
            filter: blur(8px);
            opacity: 0.8;
        }

        /* 第二層反向旋轉，增加層次感 */
        .blackhole-ring-inner {
            position: absolute;
            width: 90%;
            height: 90%;
            border-radius: 50%;
            background: conic-gradient(from 180deg, transparent, #00f2ff, transparent 50%);
            animation: rotate 1.5s linear infinite reverse;
            filter: blur(4px);
            opacity: 0.5;
        }

        /* 中心黑洞區域 */
        .speed-display {
            position: relative;
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, #000 60%, #111 100%);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 50px rgba(0, 122, 255, 0.5);
            z-index: 10;
        }

        .gear {
            font-size: 18px;
            color: #444;
            letter-spacing: 8px;
            margin-bottom: -10px;
        }

        .gear span.active {
            color: var(--glow-color);
            text-shadow: 0 0 10px var(--glow-color);
            font-weight: bold;
        }

        .speed-num {
            font-size: 100px;
            font-weight: 800;
            margin: 0;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .unit {
            font-size: 20px;
            color: #666;
            margin-top: -5px;
            text-transform: uppercase;
        }

        /* 啟動按鈕 (位於下方) */
        .controls {
            position: absolute;
            bottom: 40px;
            text-align: center;
        }

        button {
            padding: 12px 30px;
            background: transparent;
            color: var(--glow-color);
            border: 1px solid var(--glow-color);
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
        }

        button:hover {
            background: var(--glow-color);
            color: white;
            box-shadow: 0 0 20px var(--glow-color);
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="blackhole-container">
        <div class="blackhole-ring"></div>
        <div class="blackhole-ring-inner"></div>
        
        <div class="speed-display">
            <div class="gear">P R N <span class="active">D</span></div>
            <h1 id="speed">0</h1>
            <div class="unit">km/h</div>
        </div>
    </div>

    <div class="controls">
        <button onclick="requestSpeed()">ENTER HYPERDRIVE</button>
        <p id="status" style="font-size: 12px; color: #444; margin-top: 10px;">Waiting for GPS...</p>
    </div>

<script>
    function requestSpeed() {
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition((position) => {
                let speed = position.coords.speed || 0;
                let kmh = Math.round(speed * 3.6);
                document.getElementById('speed').innerText = kmh;
                document.getElementById('status').innerText = "Signal: Optimal";
                
                // 動態調整旋轉速度：開越快轉越快
                let rotateSpeed = Math.max(0.5, 2 - (kmh / 100)); 
                document.querySelector('.blackhole-ring').style.animationDuration = rotateSpeed + 's';
            }, 
            (err) => { document.getElementById('status').innerText = "Error: " + err.message; }, 
            { enableHighAccuracy: true });
        }
    }
</script>
</body>
</html>
