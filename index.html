<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MidnightDrive | BlackHole Neon HUD</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-red: #ff0033;
            --bg-dark: #000000;
        }

        body, html {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0; padding: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        /* 🌌 終極黑洞特效層：雙層旋轉以增加深度 */
        .hyperdrive-wrapper {
            position: absolute; width: 200%; height: 200%;
            display: flex; justify-content: center; align-items: center;
            z-index: -1;
        }

        .blackhole-ring {
            position: absolute; width: 100%; height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, 
                var(--bg-dark) 10%, 
                var(--neon-blue) 30%, 
                var(--bg-dark) 50%, 
                #007aff 70%, 
                var(--bg-dark) 90%);
            animation: rotateFull 3s linear infinite;
            filter: blur(100px); /* 強化模糊，填滿黑色部分 */
            opacity: 0.5;
            transition: background 0.8s ease;
        }

        /* ⚠️ 超速時背景切換為紅黃黑洞 */
        .overspeed .blackhole-ring {
            background: conic-gradient(from 0deg, 
                var(--bg-dark) 10%, 
                var(--neon-red) 30%, 
                var(--bg-dark) 50%, 
                #ffcc00 70%, 
                var(--bg-dark) 90%);
            animation: rotateFull 1s linear infinite; /* 超速時狂暴旋轉 */
            opacity: 0.7;
        }

        @keyframes rotateFull { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* 🔢 螢光數字顯示區 */
        .speed-container {
            position: relative; text-align: center; z-index: 10;
        }

        .speed-num {
            font-size: calc(100vw * 0.48); 
            font-weight: 900; 
            margin: 0; line-height: 0.9;
            font-variant-numeric: tabular-nums;
            letter-spacing: -10px;
            color: #fff;
            /* 🔵 預設：強烈藍色螢光暈 */
            text-shadow: 
                0 0 10px #fff,
                0 0 30px var(--neon-blue),
                0 0 60px var(--neon-blue),
                0 0 100px var(--neon-blue);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 🔴 超速狀態：數字轉紅螢光 */
        .overspeed .speed-num {
            text-shadow: 
                0 0 10px #fff,
                0 0 30px var(--neon-red),
                0 0 60px var(--neon-red),
                0 0 100px var(--neon-red),
                0 0 150px var(--neon-red);
            animation: shake 0.2s infinite alternate;
        }

        @keyframes shake {
            from { transform: translate(1px, 1px) scale(1); }
            to { transform: translate(-1px, -1px) scale(1.01); }
        }

        .unit {
            font-size: 24px; color: #888;
            letter-spacing: 12px; margin-top: -10px;
            text-transform: uppercase; font-weight: bold;
        }

        /* 底部控制鈕 */
        .controls { position: absolute; bottom: 8%; text-align: center; width: 100%; z-index: 100; }
        button { 
            padding: 18px 50px; background: rgba(0,0,0,0.7); color: #fff;
            border: 2px solid var(--neon-blue); border-radius: 60px;
            font-weight: bold; font-size: 18px; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
        }
    </style>
</head>
<body id="main-body">

    <div class="hyperdrive-wrapper">
        <div class="blackhole-ring" id="bg-ring"></div>
    </div>
    
    <div class="speed-container">
        <h1 class="speed-num" id="speed">0</h1>
        <div class="unit">km/h</div>
    </div>

    <div class="controls">
        <button id="start-btn" onclick="engageSystem()">ENGAGE HYPERDRIVE</button>
    </div>

<script>
    const SPEED_LIMIT = 110; 

    function engageSystem() {
        document.getElementById('start-btn').style.display = 'none';
        
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition((pos) => {
                const kmh = Math.round((pos.coords.speed || 0) * 3.6);
                const speedEl = document.getElementById('speed');
                const body = document.getElementById('main-body');
                const ring = document.getElementById('bg-ring');

                speedEl.innerText = kmh;

                if (kmh > SPEED_LIMIT) {
                    body.classList.add('overspeed');
                } else {
                    body.classList.remove('overspeed');
                }

                // 動態效果：開越快，黑洞轉越快，且模糊度隨速度變化產生吸入感
                let animSpeed = Math.max(0.4, 3 - (kmh / 80));
                ring.style.animationDuration = animSpeed + 's';
                
            }, (err) => { alert("GPS Signal Lost"); }, { enableHighAccuracy: true });
        }
    }
</script>
</body>
</html>
