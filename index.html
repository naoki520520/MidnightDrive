<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MidnightDrive | Neon Speed HUD</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-red: #ff0033;
            --bg-dark: #000000;
        }

        body, html {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0; padding: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        /* 🌌 背景特效層 */
        .blackhole-background {
            position: absolute; width: 180%; height: 180%; border-radius: 50%;
            background: conic-gradient(from 0deg, var(--bg-dark) 10%, var(--neon-blue) 30%, var(--bg-dark) 50%, #007aff 70%, var(--bg-dark) 90%);
            animation: rotateFull 4s linear infinite;
            filter: blur(80px); opacity: 0.4; z-index: -2;
            transition: all 0.5s ease;
        }

        @keyframes rotateFull { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* 🔢 螢光數字核心 */
        .speed-display {
            position: relative; text-align: center; z-index: 10;
        }

        .speed-num {
            font-size: calc(100vw * 0.5); 
            font-weight: 900; 
            margin: 0; 
            line-height: 1;
            font-variant-numeric: tabular-nums;
            /* 🔵 預設：極光藍發光 */
            color: #fff;
            text-shadow: 
                0 0 10px #fff,
                0 0 20px var(--neon-blue),
                0 0 40px var(--neon-blue),
                0 0 80px var(--neon-blue);
            transition: all 0.3s ease;
        }

        /* 🔴 超速：警告紅發光 */
        .overspeed .speed-num {
            color: #fff;
            text-shadow: 
                0 0 10px #fff,
                0 0 20px var(--neon-red),
                0 0 40px var(--neon-red),
                0 0 80px var(--neon-red),
                0 0 120px var(--neon-red);
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0.8; transform: scale(1.02); }
        }

        .unit {
            font-size: 28px;
            color: #888;
            letter-spacing: 10px;
            margin-top: -20px;
            text-transform: uppercase;
        }

        .limit-info {
            position: absolute;
            top: -50px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid var(--neon-red);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            color: var(--neon-red);
            display: none;
        }

        .overspeed .limit-info { display: block; }

        .controls { position: absolute; bottom: 8%; text-align: center; width: 100%; }
        button { 
            padding: 15px 40px; background: none; color: var(--neon-blue);
            border: 2px solid var(--neon-blue); border-radius: 50px;
            font-weight: bold; font-size: 16px; cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
        }
    </style>
</head>
<body>

    <div id="main-ui">
        <div class="blackhole-background" id="bg"></div>
        
        <div class="speed-display">
            <div class="limit-info">SLOWER! SPEED LIMIT 110</div>
            <h1 class="speed-num" id="speed">0</h1>
            <div class="unit">km/h</div>
        </div>
    </div>

    <div class="controls">
        <button onclick="startTracking()">ENGAGE NEON HUD</button>
    </div>

<script>
    // 國道速限設定
    const SPEED_LIMIT = 110; 

    function startTracking() {
        document.querySelector('.controls').style.display = 'none';
        
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition((pos) => {
                const kmh = Math.round((pos.coords.speed || 0) * 3.6);
                const speedElement = document.getElementById('speed');
                const ui = document.getElementById('main-ui');
                const bg = document.getElementById('bg');

                speedElement.innerText = kmh;

                // 🔴 超速判斷邏輯
                if (kmh > SPEED_LIMIT) {
                    ui.classList.add('overspeed');
                    // 背景也轉紅
                    bg.style.background = `conic-gradient(from 0deg, #000 10%, var(--neon-red) 30%, #000 50%, #ff6600 70%, #000 90%)`;
                } else {
                    ui.classList.remove('overspeed');
                    // 回復藍色背景
                    bg.style.background = `conic-gradient(from 0deg, #000 10%, var(--neon-blue) 30%, #000 50%, #007aff 70%, #000 90%)`;
                }

                // 加速時旋轉變快
                bg.style.animationDuration = Math.max(0.5, 4 - (kmh/60)) + 's';

            }, (err) => { alert("請允許位置存取以獲得即時時速"); }, 
            { enableHighAccuracy: true });
        }
    }
</script>
</body>
</html>
